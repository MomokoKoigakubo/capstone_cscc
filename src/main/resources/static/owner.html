<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Owner Panel Capstone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="background">


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-xxl-10">

            <div class="border-2 border border-white rounded-3 p-4 billboard">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <h1 class="mb-0">Owner Panel</h1>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="index.html" class="btn btn-outline-light">Feedback form</a>
                        <a href="/logout" class="btn btn-primary">Log out</a>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Total feedback</p>
                        <p class="stat-value mb-0" id="statFeedback">&mdash;</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Total customers</p>
                        <p class="stat-value mb-0" id="statCustomers">&mdash;</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Latest submission</p>
                        <p class="stat-value-sm mb-0" id="statLatest">&mdash;</p>
                    </div>
                </div>
            </div>

            <div class="py-3 p-3 mt-3 border-2 border border-white rounded-3 billboard">
                <div id="panelMessage"></div>

                <ul class="nav nav-tabs" id="panelTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="feedbackTab" data-bs-toggle="tab"
                                data-bs-target="#feedbackPane" type="button" role="tab"
                                aria-controls="feedbackPane" aria-selected="true">
                            Feedback <span class="badge text-bg-secondary num" id="feedbackCount">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="customersTab" data-bs-toggle="tab"
                                data-bs-target="#customersPane" type="button" role="tab"
                                aria-controls="customersPane" aria-selected="false">
                            Customers <span class="badge text-bg-secondary num" id="customerCount">0</span>
                        </button>
                    </li>
                </ul>

                <div class="tab-content pt-3">
                    <div class="tab-pane fade show active" id="feedbackPane" role="tabpanel"
                         aria-labelledby="feedbackTab" tabindex="0">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="feedbackSearch" class="visually-hidden">Search feedback</label>
                                <input type="search" class="form-control" id="feedbackSearch"
                                       placeholder="Search feedback, name or email">
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Submitted</th>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Feedback</th>
                                </tr>
                                </thead>
                                <tbody id="feedbackBody">
                                <tr>
                                    <td colspan="5" class="text-center stat-label py-4">Loading feedback&hellip;</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="customersPane" role="tabpanel"
                         aria-labelledby="customersTab" tabindex="0">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="customerSearch" class="visually-hidden">Search customers</label>
                                <input type="search" class="form-control" id="customerSearch"
                                       placeholder="Search name or email">
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">First Name</th>
                                    <th scope="col">Last Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Submissions</th>
                                </tr>
                                </thead>
                                <tbody id="customerBody">
                                <tr>
                                    <td colspan="5" class="text-center stat-label py-4">Loading customers&hellip;</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="owner.js"></script>
</body>
</html>
