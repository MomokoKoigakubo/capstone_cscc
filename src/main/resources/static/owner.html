<!doctype html>
<html data-bs-theme="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Owner Panel Capstone</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="background">


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-xxl-10">

            <div class="border-2 border border-white rounded-3 p-4 billboard">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <div>
                        <h1 class="mb-0">Owner Panel</h1>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-light" href="index.html">Feedback form</a>
                        <a class="btn btn-primary" href="/logout">Log out</a>
                    </div>
                </div>
            </div>

            <div class="row g-3 mt-3">
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Total feedback</p>
                        <p class="stat-value mb-0" id="statFeedback">&mdash;</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Total customers</p>
                        <p class="stat-value mb-0" id="statCustomers">&mdash;</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="h-100 p-3 border-2 border border-white rounded-3 billboard">
                        <p class="stat-label mb-1">Latest submission</p>
                        <p class="stat-value-sm mb-0" id="statLatest">&mdash;</p>
                    </div>
                </div>
            </div>

            <div class="py-3 p-3 mt-3 border-2 border border-white rounded-3 billboard">
                <p class="stat-label mb-2">Feedback per month</p>
                <canvas height="90" id="trendChart"></canvas>
            </div>

            <div class="py-3 p-3 mt-3 border-2 border border-white rounded-3 billboard">
                <div id="panelMessage"></div>

                <ul class="nav nav-tabs" id="panelTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button aria-controls="feedbackPane" aria-selected="true" class="nav-link active"
                                data-bs-target="#feedbackPane" data-bs-toggle="tab" id="feedbackTab"
                                role="tab" type="button">
                            Feedback <span class="badge text-bg-secondary num" id="feedbackCount">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button aria-controls="customersPane" aria-selected="false" class="nav-link"
                                data-bs-target="#customersPane" data-bs-toggle="tab" id="customersTab"
                                role="tab" type="button">
                            Customers <span class="badge text-bg-secondary num" id="customerCount">0</span>
                        </button>
                    </li>
                </ul>

                <div class="tab-content pt-3">
                    <div aria-labelledby="feedbackTab" class="tab-pane fade show active" id="feedbackPane"
                         role="tabpanel" tabindex="0">
                        <form class="row g-2 mb-3 align-items-end" id="feedbackFilters" novalidate>
                            <div class="col-lg-2 col-md-12">
                                <label class="form-label stat-label mb-1" for="feedbackSearch">Keyword</label>
                                <input class="form-control" id="feedbackSearch" maxlength="100"
                                       placeholder="Search feedback, name or email"
                                       type="search">
                            </div>
                            <div class="col-lg-2 col-md-4 col-6">
                                <label class="form-label stat-label mb-1" for="feedbackFrom">From</label>
                                <input class="form-control" id="feedbackFrom" type="date">
                            </div>
                            <div class="col-lg-2 col-md-4 col-6">
                                <label class="form-label stat-label mb-1" for="feedbackTo">To</label>
                                <input class="form-control" id="feedbackTo" type="date">
                            </div>
                            <div class="col-lg-2 col-md-4 col-6">
                                <label class="form-label stat-label mb-1" for="feedbackRating">Ratings</label>
                                <select class="form-select" id="feedbackRating">
                                    <option selected value="">All ratings</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>
                            <div class="col-lg-2 col-md-4 col-6">
                                <label class="form-label stat-label mb-1" for="feedbackSort">Sort</label>
                                <select class="form-select" id="feedbackSort">
                                    <option selected value="newest">Newest first</option>
                                    <option value="oldest">Oldest first</option>
                                </select>
                            </div>
                            <div class="col-lg-2 col-md-12 col-6 d-grid">
                                <button class="btn btn-outline-light" id="feedbackClear" type="reset">Clear filters
                                </button>
                            </div>
                        </form>
                        <div id="filterMessage"></div>
                        <div class="d-flex justify-content-end mb-2">
                            <button type="button" class="btn btn-outline-light" id="exportCsv">Export CSV</button>
                        </div>

                        <div class="mb-3">
                            <p class="stat-label mb-2">Most used words <span
                                    class="small">(click one to filter by it)</span></p>
                            <div class="d-flex flex-wrap gap-2" id="topWords">
                                <span class="stat-label small">&mdash;</span>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Submitted</th>
                                    <th scope="col">Rating</th>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Feedback</th>
                                </tr>
                                </thead>
                                <tbody id="feedbackBody">
                                <tr>
                                    <td class="text-center stat-label py-4" colspan="6">Loading feedback&hellip;</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div aria-labelledby="customersTab" class="tab-pane fade" id="customersPane"
                         role="tabpanel" tabindex="0">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="visually-hidden" for="customerSearch">Search customers</label>
                                <input class="form-control" id="customerSearch" placeholder="Search name or email"
                                       type="search">
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">First Name</th>
                                    <th scope="col">Last Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Submissions</th>
                                </tr>
                                </thead>
                                <tbody id="customerBody">
                                <tr>
                                    <td class="text-center stat-label py-4" colspan="5">Loading customers&hellip;</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<script crossorigin="anonymous"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="owner.js"></script>
</body>
</html>
