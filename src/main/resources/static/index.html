<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback Form Capstone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="background">


<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="border-2 border border-white rounded-3 p-4 billboard text-center">
                <h1>User Feedback Form</h1>
            </div>

            <div class="py-3 p-3 mt-3 border-2 border border-white rounded-3 billboard">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="inputfname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="inputfname" placeholder="John" maxlength="50">
                    </div>
                    <div class="col-md-6">
                        <label for="inputlname" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="inputlname" placeholder="Doe" required
                               maxlength="75">
                    </div>
                    <div class="col-12">
                        <label for="inputEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="JohnDoe@student.cscc.edu"
                               required maxlength="70">
                    </div>
                    <div class="col-12">
                        <label for="textArea" class="form-label">Your Feedback</label>
                        <textarea class="form-control" id="textArea" rows="8" required maxlength="1000"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Submit Feedback</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
